# Temporaire : captures de la prévision Vélo'v dans la vraie application (émulateur Android et simulateur
# iPhone), déposées sur la branche. Retiré dès les captures récupérées.
name: Captures (temporaire)

on:
  push:
    branches: [claude/project-thread-bydp23]
    paths: [".github/workflows/captures.yml", ".github/ecrans/**"]

permissions:
  contents: write

concurrency:
  group: captures-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_CLI_NO_ANALYTICS: "1"
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler l'application Android
        run: ./gradlew :androidApp:assembleDebug --no-configuration-cache
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/ecrans/android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android
          path: shots
          if-no-files-found: ignore

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Installer Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Captures
        run: bash .github/ecrans/ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios
          path: shots
          if-no-files-found: ignore

  publier:
    needs: [android, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: .github/ecrans/shots
      - name: Déposer les captures sur la branche
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -f .github/ecrans/shots
          git commit -m "Captures de la prévision Vélo'v (temporaire)"
          git push origin HEAD:${{ github.ref_name }}
