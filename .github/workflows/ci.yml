# Intégration continue : à chaque commit, le module partagé est testé, l'application Android
# est compilée sur Linux et l'application iOS (qui lie le module partagé) est compilée sur macOS.
name: Compilation et tests

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "horaires/README.md"
      - "captures-tests/**"
      - "website/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Module partagé et Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Tests du script des fiches horaires
        run: python3 -m unittest discover -s horaires
      - name: Tests du module partagé
        run: ./gradlew :shared:testDebugUnitTest --no-configuration-cache
      - name: Compiler l'application Android
        run: ./gradlew :androidApp:assembleDebug --no-configuration-cache

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compiler l'application iOS
        run: |
          xcodebuild \
            -project AlerteTCL.xcodeproj \
            -scheme AlerteTCL \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test "${PIPESTATUS[0]}" -eq 0
