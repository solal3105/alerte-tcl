name = "tcl-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# Collecte des positions des véhicules, une fois par minute, conservée pour apprendre les temps
# de parcours réels (modèle de prédiction à venir). Les applications n'y accèdent pas.
# Le bucket se crée une fois avant le premier déploiement : `wrangler r2 bucket create tcl-positions`.
[triggers]
crons = ["* * * * *"]

[[r2_buckets]]
binding = "POSITIONS"
bucket_name = "tcl-positions"
