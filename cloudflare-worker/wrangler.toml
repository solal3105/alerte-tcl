name = "tcl-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# Collecte des positions des véhicules, une fois par minute, conservée pour apprendre les temps
# de parcours réels (modèle de prédiction à venir). Les applications n'y accèdent pas.
# À activer une fois R2 ouvert sur le compte Cloudflare (tableau de bord → R2 → activer, offre gratuite),
# puis `wrangler r2 bucket create tcl-positions` et redéployer :
# [triggers]
# crons = ["* * * * *"]
#
# [[r2_buckets]]
# binding = "POSITIONS"
# bucket_name = "tcl-positions"

# Cache partagé des routes temps réel (classe LiveCache de worker.js) : caches.default n'a aucun
# effet sur une adresse *.workers.dev. Objet durable SQLite, disponible sur l'offre gratuite.
[[durable_objects.bindings]]
name = "LIVE_CACHE"
class_name = "LiveCache"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveCache"]
